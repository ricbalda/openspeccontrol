# Fase 10 (tarea 10.3): release con firma y notarización.
#
# Se dispara al empujar una etiqueta v* (p. ej. v0.2.0). Pasos:
#   1. verify   → la etiqueta == versión de package.json, están TODOS los secretos de
#                 firma y notarización (si falta alguno falla aquí, antes de construir,
#                 y no se genera ningún artefacto sin firmar) y pasan lint/typecheck/test.
#   2. build    → Windows (NSIS x64 + arm64), macOS (dmg + zip universales, notarizado)
#                 y Linux (AppImage + deb x64 + arm64) en runners nativos.
#   3. release  → crea el release EN BORRADOR con los instaladores, los .blockmap y los
#                 latest*.yml que lee electron-updater. Publicarlo es un paso manual.
#
# Secretos de GitHub necesarios (solo nombres; los valores NO viven en el repositorio,
# ver la sección "Crear un release" del README y build/SIGNING.md):
#   Windows (UNA de las dos vías):
#     WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD                      certificado .pfx (base64) y contraseña
#     AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET  Azure Trusted Signing (credenciales)
#     AZURE_SIGN_ENDPOINT, AZURE_SIGN_ACCOUNT, AZURE_SIGN_PROFILE, AZURE_SIGN_PUBLISHER
#   macOS:
#     CSC_LINK, CSC_KEY_PASSWORD                               Developer ID Application (.p12 en base64)
#     y UNA de las dos vías de notarización:
#       APPLE_API_KEY (contenido del .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER
#       APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Linux no firma. El release usa el GITHUB_TOKEN del propio workflow (no hace falta otro).
#
# Estado de verificación: este workflow solo puede comprobarse al ejecutarse en GitHub con
# un tag de prueba y las credenciales reales (no se ejecutó al escribirlo; sí se validó la
# sintaxis y que los scripts existen).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# un solo release a la vez por etiqueta; nunca se cancela uno a medias
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verificar etiqueta, secretos y tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # falla ANTES de construir si la etiqueta no es la versión o falta algún secreto de firma
      - name: Comprobar etiqueta y secretos de firma
        run: node scripts/release-check.mjs --tag "$GITHUB_REF_NAME" --signing
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Instalar npm 12
        run: npm install -g npm@12

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: Empaquetar · ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: release-windows
          - name: macOS
            os: macos-latest
            artifact: release-macos
          - name: Linux
            os: ubuntu-latest
            artifact: release-linux
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar npm 12
        run: npm install -g npm@12

      - run: npm ci

      # la clave de la API de notarización llega como contenido del .p8; electron-builder
      # espera la RUTA de un fichero, así que se escribe en un archivo temporal del runner
      - name: Preparar la clave de notarización (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
            chmod 600 "$key"
            echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
          fi

      # `--publish never`: la publicación la hace el job `release`, nunca electron-builder.
      # Cada paso recibe solo los secretos de su plataforma.
      - name: Empaquetar y firmar (Windows)
        if: runner.os == 'Windows'
        run: npm run dist:win -- --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}

      - name: Empaquetar, firmar y notarizar (macOS)
        if: runner.os == 'macOS'
        run: npm run dist:mac -- --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        run: npm run dist:linux -- --publish never

      # instaladores + .blockmap (descarga diferencial) + latest*.yml (los lee electron-updater)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.zip
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.blockmap
            release/*/latest*.yml

  release:
    name: Release en borrador
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Listar artefactos
        run: ls -lh artifacts

      # el release queda en BORRADOR: se revisa a mano y se publica desde GitHub.
      # Si ya existe en borrador (se relanzó el workflow) se reemplazan sus archivos;
      # si ya está publicado, se falla para no pisar un release público.
      - name: Crear o actualizar el borrador
        run: |
          shopt -s nullglob
          files=(artifacts/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No hay artefactos que publicar"
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::El release $TAG ya está publicado; no se modifica"
              exit 1
            fi
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            flags=()
            case "$TAG" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$TAG" "${files[@]}" \
              --draft --verify-tag --generate-notes \
              --title "OpenSpecControl $TAG" "${flags[@]}"
          fi
